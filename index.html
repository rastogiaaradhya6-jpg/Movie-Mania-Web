<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MovieMania – Search & Discover Movies</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1 class="logo">Movie<span>Mania</span></h1>
    <input id="search" type="search" placeholder="Search movies by title..." aria-label="Search movies">
    <nav class="tabs">
      <button class="tab active" data-view="browse">Browse</button>
      <button class="tab" data-view="favourites">❤ Favourites (<span id="fav-count">0</span>)</button>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h2>Find your next favourite movie</h2>
      <p>Search, filter by genre, and save the movies you love.</p>
    </section>

    <div id="genre-filters" class="chips" aria-label="Genre filters"></div>

    <section id="recommend-section">
      <h3>Recommended for you</h3>
      <div id="recommend-grid" class="grid"></div>
    </section>

    <section>
      <h3 id="list-title">All Movies</h3>
      <div id="movie-grid" class="grid"></div>
      <p id="empty" class="empty"></p>
    </section>
  </main>

  <footer>© 2026 MovieMania · Sample data for a student project</footer>
  <script src="script.js"></script>
</body>
</html>
